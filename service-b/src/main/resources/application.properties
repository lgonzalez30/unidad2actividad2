quarkus.application.name=service-b
quarkus.http.port=8080

quarkus.otel.enabled=true
quarkus.otel.sdk.disabled=${QUARKUS_OTEL_SDK_DISABLED:false}
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
quarkus.otel.exporter.otlp.protocol=grpc
quarkus.otel.traces.sampler=always_on
quarkus.otel.metrics.enabled=true
quarkus.otel.logs.enabled=true
quarkus.otel.resource.attributes=deployment.environment=${DEPLOYMENT_ENVIRONMENT:local},cloud.provider=${CLOUD_PROVIDER:local},service.namespace=otel-lab

quarkus.dynamodb.aws.region=${AWS_REGION:us-east-1}
%local.quarkus.dynamodb.endpoint-override=${DYNAMODB_ENDPOINT:http://dynamodb-local:8000}
quarkus.dynamodb.sync-client.type=url
quarkus.dynamodb.telemetry.enabled=true

quarkus.micrometer.binder.http-server.enabled=true
quarkus.micrometer.binder.jvm=true
quarkus.micrometer.binder.system=true

quarkus.log.level=${LOG_LEVEL:INFO}
quarkus.log.console.json=true
quarkus.log.console.json.mdc.flat-fields=true
quarkus.log.console.json.additional-field."service".value=service-b
quarkus.log.console.json.additional-field."service".type=string
quarkus.log.console.json.exception-output-type=formatted
