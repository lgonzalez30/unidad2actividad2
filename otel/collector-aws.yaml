receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  resource:
    attributes:
      - key: deployment.environment
        value: lab
        action: upsert
      - key: cloud.provider
        value: aws
        action: upsert
  batch:
    timeout: 5s
    send_batch_size: 1024

exporters:
  awsxray:
    region: ${env:AWS_REGION}
  otlp/jaeger:
    endpoint: jaeger.otel-lab.local:4317
    tls:
      insecure: true
  awscloudwatchlogs:
    region: ${env:AWS_REGION}
    log_group_name: ${env:OTEL_LOG_GROUP}
    log_stream_name: ${env:OTEL_LOG_STREAM}
  awsemf:
    region: ${env:AWS_REGION}
    namespace: otel-lab
    log_group_name: ${env:OTEL_METRICS_LOG_GROUP}
    log_stream_name: ${env:OTEL_METRICS_LOG_STREAM}
    resource_to_telemetry_conversion:
      enabled: true
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [awsxray, otlp/jaeger, debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [awsemf, debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [awscloudwatchlogs, debug]

  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
