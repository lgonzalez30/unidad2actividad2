services:
  dynamodb-local:
    image: amazon/dynamodb-local:2.6.1
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_REGION: us-east-1
    ports:
      - "8000:8000"

  dynamodb-seed:
    image: amazon/aws-cli:2.22.17
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until aws dynamodb list-tables --endpoint-url http://dynamodb-local:8000 >/dev/null 2>&1; do
          sleep 1
        done
        aws dynamodb create-table --endpoint-url http://dynamodb-local:8000 --table-name otel-lab-products --attribute-definitions AttributeName=product_id,AttributeType=S --key-schema AttributeName=product_id,KeyType=HASH --billing-mode PAY_PER_REQUEST || true
        aws dynamodb put-item --endpoint-url http://dynamodb-local:8000 --table-name otel-lab-products --item '{"product_id":{"S":"product-1"},"name":{"S":"Notebook"},"price":{"N":"49.90"}}'
        aws dynamodb put-item --endpoint-url http://dynamodb-local:8000 --table-name otel-lab-products --item '{"product_id":{"S":"product-2"},"name":{"S":"Backpack"},"price":{"N":"79.90"}}'
        aws dynamodb put-item --endpoint-url http://dynamodb-local:8000 --table-name otel-lab-products --item '{"product_id":{"S":"product-3"},"name":{"S":"Headphones"},"price":{"N":"99.90"}}'
    depends_on:
      - dynamodb-local

  jaeger:
    image: jaegertracing/all-in-one:1.63.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "14250:14250"

  otel-collector-a:
    image: otel/opentelemetry-collector-contrib:0.116.1
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel/collector-local.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "14317:4317"
      - "14318:4318"
      - "18888:8888"
      - "19464:9464"
    depends_on:
      - jaeger

  otel-collector-b:
    image: otel/opentelemetry-collector-contrib:0.116.1
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel/collector-local.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "24317:4317"
      - "24318:4318"
      - "28888:8888"
      - "29464:9464"
    depends_on:
      - jaeger

  service-a:
    build: ./service-a
    environment:
      QUARKUS_PROFILE: local
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector-a:4317
      SERVICE_B_URL: http://service-b:8080
      DEPLOYMENT_ENVIRONMENT: local
      CLOUD_PROVIDER: local
    ports:
      - "8080:8080"
    depends_on:
      otel-collector-a:
        condition: service_started

  service-b:
    build: ./service-b
    environment:
      QUARKUS_PROFILE: local
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector-b:4317
      DEPLOYMENT_ENVIRONMENT: local
      CLOUD_PROVIDER: local
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      DYNAMODB_ENDPOINT: http://dynamodb-local:8000
      PRODUCTS_TABLE_NAME: otel-lab-products
    ports:
      - "8081:8080"
    depends_on:
      dynamodb-seed:
        condition: service_completed_successfully
      otel-collector-b:
        condition: service_started

  prometheus:
    image: prom/prometheus:v3.0.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=2h"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - service-a
      - service-b
      - otel-collector-a
      - otel-collector-b

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - jaeger

  k6:
    image: grafana/k6:0.54.0
    profiles: ["benchmark"]
    volumes:
      - ./benchmark:/scripts:ro
    environment:
      BASE_URL: http://service-a:8080
    depends_on:
      - service-a
