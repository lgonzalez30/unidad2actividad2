server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: app-json-logs
    static_configs:
      - targets: ["localhost"]
        labels:
          job: app-json-logs
          __path__: /var/log/app/*.log
    pipeline_stages:
      - json:
          expressions:
            level: levelname
            service_name: service_name
            trace_id: trace_id
            span_id: span_id
            message: message
      - labels:
          level:
          service_name:
          trace_id:
          span_id:
